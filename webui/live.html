<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实时操作页面</title><style>body{margin:0;background:#182333;color:#eef4fb;font:14px Microsoft YaHei,Arial}.bar{height:48px;background:#24364c;display:flex;align-items:center;padding:0 14px;gap:12px}.title{font-weight:700}.muted{color:#aab9c9}.wrap{padding:12px;display:grid;grid-template-columns:minmax(500px,1fr) 360px;gap:12px}.shot{background:#0d141d;border:1px solid #40536a;min-height:420px}.shot iframe{width:100%;height:calc(100vh - 90px);min-height:420px;border:0;display:block}.side{background:#24364c;border:1px solid #40536a;padding:12px;overflow:auto;max-height:calc(100vh - 90px)}pre{white-space:pre-wrap;word-break:break-word;font:12px Consolas,monospace;line-height:1.55}@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{max-height:280px}}</style><div class="bar"><span class="title">实时操作页面</span><span id="account" class="muted"></span><span id="stage" class="muted"></span><span class="muted">当前显示：账号实际占用的 Xvfb 槽位 · noVNC只作观察</span></div><div class="wrap"><div class="shot"><iframe id="vnc" title="客户端实时桌面"></iframe></div><div class="side"><b>实时页面诊断</b><pre id="diag">等待数据...</pre></div></div><script>const key=location.pathname.split('/').pop().replace('.html',''),$=x=>document.getElementById(x);let seq=0,lastToken='';function loadVnc(token){if(!token)return;if(token===lastToken&&$('vnc').src)return;lastToken=token;seq++;$('vnc').src=location.protocol+'//'+location.hostname+':22223/vnc.html?autoconnect=true&resize=scale&view_only=true&reconnect=true&path=websockify%3Ftoken%3D'+encodeURIComponent(token)+'&_='+seq}async function tick(){try{let a=await fetch('/accounts?_='+Date.now()).then(r=>r.json()),x=a.find(v=>v.key===key),s=x&&x.state||{};$('account').textContent=x?x.username:key;$('stage').textContent=(s.stage||s.status||'等待')+(s.vnc_token?' · '+s.vnc_token:'');$('diag').textContent=JSON.stringify(s,null,2);loadVnc(s.vnc_token)}catch(e){$('diag').textContent='读取失败：'+e}}tick();setInterval(tick,1000)</script></html>
